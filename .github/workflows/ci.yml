name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/CampusSync.Tests -c Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory TestResults

      - name: Install Playwright Chromium
        run: pwsh tests/CampusSync.E2ETests/bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      - name: End-to-end tests (Playwright)
        run: dotnet test tests/CampusSync.E2ETests -c Release --no-build --logger "trx;LogFileName=e2e.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: docker compose build
